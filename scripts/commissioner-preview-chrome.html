<title>uxpaul in Commissioner</title>
<style>
@font-face {
  font-family: 'Bricolage Live';
  src: url(data:font/woff2;base64,__BRIC__) format('woff2-variations');
  font-weight: 200 800; font-stretch: 75% 100%; font-display: block;
}
@font-face {
  font-family: 'Commissioner Live';
  src: url(data:font/woff2;base64,__CMSR__) format('woff2-variations');
  font-weight: 100 900; font-display: block;
}
:root { --face: 'Bricolage Live'; }
html[data-face='commissioner'] { --face: 'Commissioner Live'; }

/* Voice by rung, matching app/sandbox/home-commissioner/home-commissioner.css.
   Reading voice on the page, display voice on the two display roles. */
html[data-face='commissioner'] body { font-variation-settings: 'FLAR' 0, 'VOLM' 0; }
html[data-face='commissioner'] :is(.text-cover, .case-study-card h2, .text-qh-title) {
  font-variation-settings: 'FLAR' var(--voice-flar, 40), 'VOLM' 0;
}
html[data-face='commissioner'][data-voice='off']   { --voice-flar: 0; }
html[data-face='commissioner'][data-voice='soft']  { --voice-flar: 40; }
html[data-face='commissioner'][data-voice='flare'] { --voice-flar: 100; }

/* The signature. .text-lede carries 340; the three noun phrases are
   font-[720] utilities in app/page.tsx, so 820 has to reach them there. */
html[data-sig='820'] .text-lede .font-\[720\] { --tw-font-weight: 820; font-weight: 820; }

/* Sandbox chrome. Always Bricolage so the control is never mistaken for the
   specimen. */
#bench-bar {
  position: fixed; inset: auto 0 0 0; z-index: 90;
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
  padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
  background: var(--bg-surface-elevated);
  border-top: 1px solid var(--border-default);
  font-family: 'Bricolage Live', system-ui, sans-serif;
  font-variation-settings: normal;
}
#bench-bar .lg {
  font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600;
}
#bench-bar .lg:not(:first-child) { margin-left: 0.625rem; }
#bench-bar button {
  font: inherit; font-size: 0.8125rem; line-height: 1; min-height: 42px;
  padding: 0.5rem 0.6875rem; border: 1px solid var(--border-default);
  border-radius: 0.375rem; background: var(--bg-surface);
  color: var(--text-secondary); cursor: pointer;
}
#bench-bar button[aria-pressed='true'] {
  background: var(--text-primary); border-color: var(--text-primary); color: var(--bg-canvas);
}
#bench-probe {
  display: none; margin: 1rem; padding: 0.75rem 1rem;
  border: 1px solid var(--border-strong); border-radius: 0.375rem;
  font-family: 'Bricolage Live', system-ui, sans-serif;
  font-size: 0.875rem; line-height: 1.5; color: var(--text-primary);
}
#bench-probe[data-failed='true'] { display: block; }
body { padding-bottom: 7rem; }

/* The captured production stylesheet follows, unmodified except for three
   substitutions: next/font's @font-face rules removed, --font-sans pointed at
   the toggle, and non-ASCII escaped so the file decodes without a charset. */
__CSS__
</style><div id="bench-probe"></div>
<div aria-hidden="true" class="site-header-sentinel"></div>
__HTML__
<div id="bench-bar">
  <span class="lg">face</span>
  <button type="button" data-key="face" data-val="commissioner" aria-pressed="true">Commissioner</button>
  <button type="button" data-key="face" data-val="bricolage" aria-pressed="false">Bricolage</button>
  <span class="lg">voice</span>
  <button type="button" data-key="voice" data-val="off" aria-pressed="false">off</button>
  <button type="button" data-key="voice" data-val="soft" aria-pressed="true">40</button>
  <button type="button" data-key="voice" data-val="flare" aria-pressed="false">Flare</button>
  <span class="lg">signature</span>
  <button type="button" data-key="sig" data-val="720" aria-pressed="true">340/720</button>
  <button type="button" data-key="sig" data-val="820" aria-pressed="false">340/820</button>
  <span class="lg">mode</span>
  <button type="button" data-key="mode" data-val="light" aria-pressed="true">light</button>
  <button type="button" data-key="mode" data-val="dark" aria-pressed="false">dark</button>
</div>
<script>
(function () {
  var root = document.documentElement;
  root.setAttribute('data-face', 'commissioner');
  root.setAttribute('data-voice', 'soft');
  root.setAttribute('data-sig', '720');

  // The site keys dark mode off `.dark` on <html> (next-themes, attribute="class").
  // Start from the viewer's theme, then let the bar override it.
  function setMode(m) {
    root.classList.toggle('dark', m === 'dark');
    root.classList.toggle('light', m !== 'dark');
    root.style.colorScheme = m;
  }
  var stamped = root.getAttribute('data-theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var startMode = stamped === 'dark' || (stamped !== 'light' && prefersDark) ? 'dark' : 'light';
  setMode(startMode);

  var bar = document.getElementById('bench-bar');
  bar.querySelectorAll('button[data-key="mode"]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-val') === startMode));
  });

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-val]');
    if (!b) return;
    var key = b.getAttribute('data-key');
    bar.querySelectorAll('button[data-key="' + key + '"]').forEach(function (o) {
      o.setAttribute('aria-pressed', String(o === b));
    });
    if (key === 'mode') setMode(b.getAttribute('data-val'));
    else root.setAttribute('data-' + key, b.getAttribute('data-val'));
    try { localStorage.setItem('uxp-' + key, b.getAttribute('data-val')); } catch (err) {}
  });

  try {
    ['face', 'voice', 'sig'].forEach(function (key) {
      var v = localStorage.getItem('uxp-' + key);
      if (!v) return;
      var t = bar.querySelector('button[data-key="' + key + '"][data-val="' + v + '"]');
      if (!t) return;
      bar.querySelectorAll('button[data-key="' + key + '"]').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o === t));
      });
      root.setAttribute('data-' + key, v);
    });
  } catch (err) {}

  // The site's own header-elevation mechanism, reproduced: an ~8px sentinel at
  // the top of the page, an IntersectionObserver, and `data-scrolled` on the
  // header once it leaves the viewport. Same hysteresis, same attribute, same
  // CSS. Reproducing it beats faking a background, because the elevated header
  // is one of the surfaces worth looking at in a new typeface.
  var sentinel = document.querySelector('.site-header-sentinel');
  var header = document.querySelector('header.site-header');
  if (sentinel && header && 'IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) header.removeAttribute('data-scrolled');
      else header.setAttribute('data-scrolled', '');
    }, { threshold: 0 }).observe(sentinel);
  }

  // Assertion 8b, same two corrections as the repo routes: a terminal-rich
  // lowercase string, because flare barely moves a caps-heavy one, and no claim
  // about VOLM, which does not change advance width at all.
  function w(fvs) {
    var s = document.createElement('span');
    s.textContent = 'nnnnnnnnnnnnnnnn';
    s.setAttribute('aria-hidden', 'true');
    s.style.cssText =
      "position:absolute;left:-9999px;top:0;white-space:nowrap;font-size:200px;font-weight:400;" +
      "font-family:'Commissioner Live';font-variation-settings:" + fvs;
    document.body.appendChild(s);
    var x = s.getBoundingClientRect().width;
    s.remove();
    return x;
  }
  function probe() {
    var a = w("'FLAR' 0"), c = w("'FLAR' 100");
    if (Math.abs(a - c) > 2) return;
    var el = document.getElementById('bench-probe');
    el.setAttribute('data-failed', 'true');
    el.textContent =
      'The flare axis is not rendering (' + a.toFixed(1) + 'px against ' + c.toFixed(1) +
      'px). This is Commissioner with no voice axis. Judge nothing until it clears.';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(probe).catch(function () {});
  else setTimeout(probe, 1500);
})();
</script>
