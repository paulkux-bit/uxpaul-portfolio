<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>DependencyMap — E and F</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@340;400;500;600;720&display=swap" rel="stylesheet">
<style>
:root{
  --chroma-unit:0.002; --hue-ground:70; --hue-surface:68; --hue-text:55;
  --bg-canvas:oklch(0.978 calc(var(--chroma-unit)*8) calc(var(--hue-ground) + 6));
  --bg-surface:oklch(0.948 calc(var(--chroma-unit)*11) calc(var(--hue-ground) + 2));
  --text-primary:oklch(0.215 calc(var(--chroma-unit)*9) var(--hue-text));
  --text-secondary:oklch(0.355 calc(var(--chroma-unit)*10) var(--hue-text));
  --text-muted:oklch(0.485 calc(var(--chroma-unit)*11) var(--hue-text));
  --text-subtle:oklch(0.590 calc(var(--chroma-unit)*10) calc(var(--hue-text) + 5));
  --border-subtle:oklch(0.905 calc(var(--chroma-unit)*15) calc(var(--hue-ground) - 4));
  --border-default:oklch(0.855 calc(var(--chroma-unit)*17) calc(var(--hue-ground) - 10));
  --border-strong:oklch(0.760 calc(var(--chroma-unit)*20) calc(var(--hue-ground) - 15));
  --sp-3xs:.25rem; --sp-2xs:.5rem; --sp-xs:.75rem; --sp-s:1rem; --sp-m:1.5rem; --sp-l:2rem; --sp-xl:3rem;
}
html.dark{
  --bg-canvas:oklch(0.165 calc(var(--chroma-unit)*3) var(--hue-ground));
  --bg-surface:oklch(0.205 calc(var(--chroma-unit)*7) calc(var(--hue-ground) + 2));
  --text-primary:oklch(0.945 calc(var(--chroma-unit)*6) calc(var(--hue-text) + 4));
  --text-secondary:oklch(0.825 calc(var(--chroma-unit)*7) calc(var(--hue-text) + 2));
  --text-muted:oklch(0.705 calc(var(--chroma-unit)*8) calc(var(--hue-text) - 2));
  --text-subtle:oklch(0.565 calc(var(--chroma-unit)*9) calc(var(--hue-text) - 6));
  --border-subtle:oklch(0.245 calc(var(--chroma-unit)*7) calc(var(--hue-ground) + 2));
  --border-default:oklch(0.310 calc(var(--chroma-unit)*10) calc(var(--hue-ground) + 3));
  --border-strong:oklch(0.430 calc(var(--chroma-unit)*13) var(--hue-ground));
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-canvas);color:var(--text-primary);font-family:Commissioner,system-ui,sans-serif;
  font-weight:400;-webkit-font-smoothing:antialiased;padding:2.5rem 1.5rem 4rem}
.wrap{max-width:47rem;margin:0 auto}
.tag{font-size:.875rem;letter-spacing:.11em;text-transform:uppercase;color:var(--text-subtle);
  font-weight:500;margin-bottom:var(--sp-m);padding-bottom:var(--sp-2xs);border-bottom:1px solid var(--border-subtle)}
.cap{font-size:.875rem;line-height:1.5;color:var(--text-muted);max-width:56ch;margin-top:var(--sp-m)}
.cap strong{color:var(--text-primary);font-weight:600}
hr.sep{border:0;border-top:1px solid var(--border-subtle);margin:var(--sp-xl) 0 var(--sp-l)}

/* ══ E · ANATOMY OF THE PROMISE ═════════════════════════════════════
   Not an inventory. One sentence, taken apart. Each clause of the thing
   a shopper reads is a claim, and each claim needed something built
   before it could be true. The clause is repeated verbatim in its row,
   so the quote and the rows are visibly the same words. */
.pa{margin:0}
.pa__quote{font-size:1.5rem;line-height:1.3;font-weight:500;letter-spacing:-.01em;
  color:var(--text-subtle);max-width:20ch;margin-bottom:var(--sp-m)}
.pa__quote b{font-weight:500;color:var(--text-primary)}
.pa__rows{list-style:none;display:grid;gap:0;border-top:1px solid var(--border-strong)}
.pa__rows li{display:grid;gap:.3rem;padding:var(--sp-s) 0;border-bottom:1px solid var(--border-subtle)}
.pa__claim{font-size:1.125rem;line-height:1.25;font-weight:600;color:var(--text-primary)}
.pa__need{font-size:.9375rem;line-height:1.4;color:var(--text-muted)}
.pa__fix{font-size:.875rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
  color:var(--text-primary)}
.pa__fix em{font-style:normal;color:var(--text-subtle);font-variant-numeric:tabular-nums;margin-right:.45rem}
@media (min-width:768px){
  .pa__quote{font-size:2rem;max-width:22ch}
  .pa__rows li{grid-template-columns:11rem 1fr 12rem;gap:var(--sp-m);align-items:baseline;
    padding:var(--sp-s) 0}
  .pa__fix{text-align:right}
}

/* ══ F · WHAT SHIPPING IT FIRST WOULD HAVE COST ═════════════════════
   The consequence table. Same six surfaces, but the second column is the
   broken promise you create by shipping them before the plumbing. Closes
   the loop with the three failures in section 02. */
.cf{margin:0}
.cf__head{display:none}
.cf__rows{list-style:none;display:grid;gap:0;border-top:1px solid var(--border-strong)}
.cf__rows li{display:grid;gap:.35rem;padding:var(--sp-s) 0;border-bottom:1px solid var(--border-subtle)}
.cf__a{font-size:.9375rem;line-height:1.4;font-weight:600;color:var(--text-primary)}
.cf__b{font-size:.9375rem;line-height:1.4;color:var(--text-muted);
  padding-left:1.1rem;position:relative}
.cf__b::before{content:"";position:absolute;left:0;top:.62em;width:.55rem;height:1px;
  background:var(--border-strong)}
@media (min-width:768px){
  .cf__head{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-m);margin-bottom:var(--sp-2xs)}
  .cf__head span{font-size:.875rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--text-subtle);font-weight:500}
  .cf__rows li{grid-template-columns:1fr 1fr;gap:var(--sp-m);align-items:baseline}
  .cf__b{padding-left:0}
  .cf__b::before{display:none}
}

/* ══ H · MILESTONE / FEATURES / DEPRIVATION ═════════════════════════
   G with the product actually in it. Every feature named below is on a
   real 2019 screen in the deck: p16 home, p17 PLP, p18 PDP, p19 cart,
   p20 SMS. Nothing invented. */
.mf{margin:0}
.mf__head{display:none}
.mf__rows{list-style:none;display:grid;gap:0;border-top:1px solid var(--border-strong)}
.mf__rows > li{display:grid;gap:var(--sp-xs);padding:var(--sp-m) 0;
  border-bottom:1px solid var(--border-subtle)}
.mf__m{font-size:1.125rem;line-height:1.25;font-weight:600;color:var(--text-primary)}
.mf__m em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--text-subtle);margin-right:.5rem}
.mf__f{list-style:none;display:grid;gap:var(--sp-2xs)}
.mf__f li{font-size:.9375rem;line-height:1.4;color:var(--text-primary);
  padding-left:var(--sp-s);position:relative}
.mf__f li::before{content:"";position:absolute;left:0;top:.62em;width:.55rem;height:1px;
  background:var(--border-strong)}
.mf__u{font-size:.9375rem;line-height:1.45;color:var(--text-muted);max-width:44ch}
.mf__coda{margin-top:var(--sp-l);padding-top:var(--sp-m);border-top:1px solid var(--text-primary)}
.mf__coda b{display:block;font-size:.875rem;letter-spacing:.11em;text-transform:uppercase;
  font-weight:500;color:var(--text-subtle);margin-bottom:var(--sp-2xs)}
.mf__coda p{font-size:1.75rem;line-height:1.2;font-weight:600;letter-spacing:-.012em;
  color:var(--text-primary);max-width:20ch}
@media (min-width:768px){.mf__coda p{font-size:2.25rem;max-width:22ch}}
.mf__u b{font-weight:500;color:var(--text-subtle);letter-spacing:.08em;
  text-transform:uppercase;font-size:.875rem;display:block;margin-bottom:var(--sp-3xs)}
@media (min-width:768px){
  .mf__head{display:grid;grid-template-columns:13rem 1fr 1fr;gap:var(--sp-m);margin-bottom:var(--sp-2xs)}
  .mf__head span{font-size:.875rem;letter-spacing:.11em;text-transform:uppercase;
    color:var(--text-subtle);font-weight:500}
  .mf__rows > li{grid-template-columns:13rem 1fr 1fr;gap:var(--sp-m);align-items:start}
  .mf__u b{display:none}
}
</style></head>
<body><div class="wrap">
<p class="tag">H &middot; Milestone / features / what it replaced</p>
<figure class="mf">
  <div class="mf__head" aria-hidden="true"><span>What shipped</span><span>What it put on the screen</span><span>What it replaced</span></div>
  <ol class="mf__rows">
    <li>
      <span class="mf__m"><em>01</em>Inventory sync</span>
      <ul class="mf__f"><li>Stock truth at the item level, not the page level</li><li>Pickup offered only at stores that have it, with the nearest one named</li><li>Out of stock caught before the charge</li></ul>
      <p class="mf__u"><b>What it replaced</b>An order confirmed, then a cancellation email four days after she paid.</p>
    </li>
    <li>
      <span class="mf__m"><em>02</em>Delivery date accuracy</span>
      <ul class="mf__f"><li>A named arrival date on the product page</li><li>Delivery-date and pickup filters in browse</li><li>The same date in the ad, the cart, and the text message</li></ul>
      <p class="mf__u"><b>What it replaced</b>Cost and timing appearing at checkout, after she had chosen everything.</p>
    </li>
    <li>
      <span class="mf__m"><em>03</em>Split shipment logic</span>
      <ul class="mf__f"><li>One shipment wherever one was possible</li><li>An options panel that says why a choice is unavailable</li><li>Shipped, arriving today, and delivered, by text</li></ul>
      <p class="mf__u"><b>What it replaced</b>One order arriving as three boxes, because nothing decided otherwise.</p>
    </li>
  </ol>
  <div class="mf__coda">
    <b>What all three made possible</b>
    <p>Arrives by Sept 13, in one box.</p>
  </div>
  <figcaption class="cap"><strong>The roadmap, and what each fix put on the screen.</strong> Every feature here is on a 2019 screen. None of them could ship until the plumbing under it was true.</figcaption>
</figure>
</div></body></html>
